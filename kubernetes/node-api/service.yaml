# A stable name and address (node-api:3000) in front of all node-api Pods.
apiVersion: v1
kind: Service
metadata:
  name: node-api
  namespace: bookshop
  labels: { app: node-api, app.kubernetes.io/part-of: bookshop }
spec:
  type: ClusterIP
  selector: { app: node-api }                # traffic goes to the Ready Pods with this label
  ports:
    - name: http
      port: 3000
      targetPort: http
