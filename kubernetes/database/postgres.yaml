# PostgreSQL 18 as a StatefulSet: a stable name (postgres-0) and its own PersistentVolumeClaim that survives restarts.
# Good enough for a lab; production databases need backups, replication and upgrades (see docs/10).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bookshop
  labels: { app: postgres, app.kubernetes.io/part-of: bookshop }
spec:
  clusterIP: None                     # headless: the name resolves straight to the Pod
  selector: { app: postgres }
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: bookshop
  labels: { app: postgres, app.kubernetes.io/part-of: bookshop }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres, app.kubernetes.io/part-of: bookshop }
    spec:
      securityContext:
        fsGroup: 70                   # the postgres user of the alpine image
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: bookshop-config, key: DB_NAME } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: bookshop-config, key: DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: DB_PASSWORD } }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bookshop", "-d", "bookshop"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "bookshop", "-d", "bookshop"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
