# A stable name and address (java-api:8080) in front of all java-api Pods.
apiVersion: v1
kind: Service
metadata:
  name: java-api
  namespace: bookshop
  labels: { app: java-api, app.kubernetes.io/part-of: bookshop }
spec:
  type: ClusterIP
  selector: { app: java-api }                # traffic goes to the Ready Pods with this label
  ports:
    - name: http
      port: 8080
      targetPort: http
