# A stable name and address (frontend:8080) in front of all frontend Pods.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bookshop
  labels: { app: frontend, app.kubernetes.io/part-of: bookshop }
spec:
  type: ClusterIP
  selector: { app: frontend }                # traffic goes to the Ready Pods with this label
  ports:
    - name: http
      port: 8080
      targetPort: http
