# Everything comes from environment variables (see docs/CONTRACT.md)
server.port=${PORT:8080}
spring.application.name=java-api

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:bookshop}
spring.datasource.username=${DB_USER:bookshop}
spring.datasource.password=${DB_PASSWORD:}
# Do not fail at startup when the database is not reachable yet: the API starts, /health answers,
# /ready says 503 until PostgreSQL answers. The pool connects on first use.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=5

# The schema is created by SchemaInitializer (with retries), not by Spring's startup-only SQL init
spring.sql.init.mode=never

# Quiet, one-line logs to stdout
spring.main.banner-mode=off
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{0} - %msg%n
logging.level.org.apache.catalina.core=WARN

# Finish running requests on SIGTERM
server.shutdown=graceful
